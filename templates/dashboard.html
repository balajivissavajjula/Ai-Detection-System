<!DOCTYPE html>
<html>

<head>

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

<h2 class="text-center text-primary">

AI Exam Dashboard

</h2>

<div class="row mt-4">

<div class="col-md-4">

<div class="card shadow">

<div class="card-body">

<h5>Total Violations</h5>

<h1 id="violations">0</h1>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow">

<div class="card-body">

<h5>Exam Status</h5>

<h3 id="status">

WAITING

</h3>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow">

<div class="card-body">

<h5>Last Object</h5>

<h3 id="object">

None

</h3>

</div>

</div>

</div>

</div>

</div>

<script>

setInterval(()=>{

fetch("/dashboard")

.then(res=>res.json())

.then(data=>{

document.getElementById("violations").innerHTML=data.violations;

document.getElementById("status").innerHTML=data.exam_started?"RUNNING":"STOPPED";

document.getElementById("object").innerHTML=data.last_object||"None";

});

},1000);

</script>

</body>

</html>
